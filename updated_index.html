
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CI/CD Project - Version 2</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #164e63);
            color: white;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #67e8f9;
            font-size: 38px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .version {
            display: inline-block;
            background-color: #065f46;
            color: #d1fae5;
            padding: 8px 16px;
            border-radius: 20px;
        }

        button {
            background-color: #06b6d4;
            color: #082f49;
            font-weight: bold;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <span class="version">VERSION 2 — UPDATED</span>

    <h1>My CI/CD Pipeline Is Working!</h1>

    <p>I updated my website and pushed the changes to GitHub.</p>

    <p>My pipeline can now build, test, and deploy the latest version.</p>

    <button onclick="alert('Version 2 deployed successfully!')">
        Test Deployment
    </button>
</body>
</html>
